# X11 configuration for PowerBook G4 trackpad
# Enables Control+Click for right-click functionality

Section "InputDevice"
    Identifier "Mouse0"
    Driver "mouse"
    Option "Protocol" "wsmouse"
    Option "Device" "/dev/wsmouse"

    # Enable 3-button mouse emulation
    # Control+Click = Right-click (button 3)
    Option "Emulate3Buttons" "true"
    Option "Emulate3Timeout" "50"

    # Optional: Enable mouse wheel emulation with buttons 4 & 5
    Option "ZAxisMapping" "4 5"
EndSection

Section "InputClass"
    Identifier "Trackpad"
    MatchIsPointer "true"
    MatchDevicePath "/dev/wsmouse*"
    Driver "mouse"

    # Enable 3-button emulation
    Option "Emulate3Buttons" "true"
    Option "Emulate3Timeout" "50"

    # Mouse wheel emulation
    Option "ZAxisMapping" "4 5"
EndSection
